<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>楓之谷工具箱</title>

  <style>
    :root{
      --main-color:#ff7b00;
      --bg-grad:linear-gradient(135deg,#ffe6c9 0%,#fff8ee 40%,#e9f6ff 100%);
    }
    body{
      margin:0;font-family: "Segoe UI",sans-serif;
      background:var(--bg-grad);
      min-height:100vh;
      display:flex;flex-direction:column;
    }
    header{background:#fff8ee;padding:1rem 2rem;box-shadow:0 2px 4px rgba(0,0,0,.1)}
    h1{margin:0;font-size:1.6rem;color:var(--main-color)}
    nav{margin-top:1rem;border-bottom:2px solid #ddd;display:flex;gap:1rem}
    nav button{
      background:none;border:none;padding:.5rem 1rem;font-size:1rem;
      cursor:pointer;border-bottom:3px solid transparent;
      border-radius:8px 8px 0 0;
      transition:background .15s, box-shadow .15s;             
    }
    nav button:hover{
      background:rgba(0,0,0,.05);
      box-shadow:0 2px 4px rgba(0,0,0,.15);
    }
    nav button.active{
      color:var(--main-color);
      border-color:var(--main-color);
      font-weight:bold;
      background:#ffffff;                    
    }
    section{display:none;padding:2rem}
    section.active{display:block}
    .timer-row.running {background: #e0f7fa;    /* 淺青底 */}
    label{display:block;margin:.8rem 0}
    input,select,button{
      padding:.4rem .6rem;font-size:1rem;
      border-radius:8px;                     
      border:1px solid #ccc;
      box-shadow:inset 0 1px 2px rgba(0,0,0,.07);
    }
    button{cursor:pointer;background:#fff;}
    button:hover{background:#f8f8f8;}
    input:focus,select:focus{
      outline:none;                                   /* 去掉預設藍框 */
      border-color:var(--main-color);                 /* 換成主題色 */
      box-shadow:0 0 0 3px rgba(255,123,0,.25);       /* 外圈光暈 */
    }
    #result{margin-top:1rem;font-weight:bold}
    /* CD 計算表格樣式 */
    #result table {
      border-collapse: collapse;
      margin-top: .5rem;
    }
    #result th,
    #result td {
      padding: .3rem .6rem;
      border: 1px solid #ccc;
    }
    #result th {
      text-align: right;
      color: #555;
    }
    footer{margin-top:auto;text-align:center;padding:1rem 0;font-size:.85rem;color:#666}
    /* 偷星計算機結果表格 */
    .starforce-result {
      border-collapse: collapse;
      width: 100%;
      max-width: 500px;
      margin-top: 1rem;
    }
    .starforce-result th,
    .starforce-result td {
      border: 1px solid #ccc;
      padding: .5rem 1rem;
    }
    .starforce-result th {
      background: #f8f8f8;
      text-align: left;
      width: 40%;
    }
    .starforce-result td {
      text-align: right;
    }
    #starforce-advice {
      font-size: 1rem;
    }
    /* 美化偷星計算機表格 */
    .starforce-result {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;               /* 橫向無邊距，縱向 8px 間距 */
      font-family: "Segoe UI", sans-serif;
    }
    .starforce-result th {
      background: #e0f7fa;
      padding: 8px 12px;
      text-align: center;                  /* 標題置中 */
      font-weight: 600;
      color: #333;
      border: none;
    }
    .starforce-result td {
      background: #ffffff;
      padding: 8px 12px;
      text-align: center;                  /* 內容置中 */
      color: #555;
      border: none;
    }
    /* 讓第一欄的 row label 左對齊，比較好讀 */
    .starforce-result tr td:first-child,
    .starforce-result tr th:first-child {
      text-align: left;
      font-weight: 600;
      background: none;
    }
    /* 交替換底色 */
    .starforce-result tr:nth-child(even) td {
      background: #f7f7f7;
    }
    /* 建議文字 */
    #starforce-advice {
      font-family: "Segoe UI", sans-serif;
      font-size: 1.1rem;
      margin-top: 12px;
    }
    /* 重新設定第一欄的底色 & 寬度，並用更高優先度覆蓋掉 background:none */
    .starforce-result tr th:first-child,
    .starforce-result tr td:first-child {
      background: #eef7fc !important;
      min-width: 140px !important;
    }

    /* 內容置中、垂直置中 */
    .starforce-result th,
    .starforce-result td {
      text-align: center;
      vertical-align: middle;
    }

    /* 第一欄標題欄位文字靠左 */
    .starforce-result tr th:first-child {
      padding-left: 16px;
      text-align: left;  /* 這裡不用 !important，因為原本那段只有 background:none */
    }
    :root {
      --sf-header-bg:   #e8f6ff;
      --sf-alt-bg:      #f5f5f5;
      --sf-first-bg:    #eaeaea;
      --sf-best-bg:     #d4edda;
      --sf-best-text:   #155724;
      --sf-text:        #333;
      --sf-green:       #155724;
      --sf-red:         #721c24;
    }

    .starforce-result {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 6px;
      font-family: "Segoe UI",sans-serif;
      margin-top: 1rem;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .starforce-result th,
    .starforce-result td {
      padding: 10px 14px;
      font-size: 0.95rem;
      color: var(--sf-text);
    }

    /* 表头 */
    .starforce-result th {
      background: var(--sf-header-bg);
      text-align: center;
      font-weight: 600;
      color: var(--sf-text);
    }

    /* 交替列 */
    .starforce-result tr:nth-child(even) td {
      background: var(--sf-alt-bg);
    }

    /* 第一欄 (“重置星數” + 各項名称) */
    .starforce-result th:first-child,
    .starforce-result td:first-child {
      background: var(--sf-first-bg) !important;
      text-align: left;
      font-weight: 600;
      padding-left: 18px;
      min-width: 150px;
    }

    /* 最佳栏位 */
    .starforce-result td.best {
      background: var(--sf-best-bg) !important;
      color: var(--sf-best-text) !important;
    }

    /* 建议文字 */
    #starforce-advice {
      font-family: "Segoe UI",sans-serif;
      font-size: 1.05rem;
      margin-top: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>楓之谷工具箱</h1>
    <nav>
      <button data-tab="cd"   class="active">CD 帽計算機</button>
      <button data-tab="timer">練等計時器</button>
      <button data-tab="star">偷星計算機</button>
    </nav>
  </header>

  <!-- CD 帽計算機 -->
  <section id="cd" class="active">
    <h2>CD 帽計算機</h2>

    <label>
      精靈角色卡減少%數：
      <select id="percentage">
        <option>0%</option>
        <option selected>5%</option>
        <option>6%</option>
      </select>
    </label>

    <label>
      技能秒數：
      <input type="number" id="original" placeholder="例如 120">
    </label>

    <label>
      裝備CD減少秒數(含羈絆翅膀)：
      <select id="reduced">
        <option value="0">0</option><option value="1">1</option><option value="2">2</option>
        <option value="3">3</option><option value="4">4</option><option value="5">5</option>
        <option value="6">6</option><option value="7">7</option><option value="8">8</option>
        <option value="9">9</option><option value="10">10</option>
      </select>
      秒
    </label>

    <button id="calc">計算</button>
    <div id="result"></div>
  </section>

  <!-- 練等計時器 -->
  <section id="timer">
    <h2>練等計時器</h2>
    <div style="margin-bottom:1rem">
      <button id="startAll">全部開始</button>
      <button id="clearAll">全部清除</button>
      <button id="restartDone">重啟結束項</button>
    </div>
    <div id="timerRows"></div>
  </section>


<!-- 偷星計算機 -->
<section id="star">
  <h2>偷星計算機</h2>

  <!-- 星數設定 -->
  <label>起始星數：
    <select id="start-star"></select>
  </label>
  <label>目標星數：
    <select id="target-star"></select>
  </label>

  <!-- 抓星選項 -->
  <label>是否抓星：
    <select id="catch-star">
      <option value="yes">是</option>
      <option value="no">否</option>
    </select>
  </label>

  <!-- 價格模式 -->
  <label>價格類型：
    <select id="currency-type">
      <option value="twd">台幣</option>
      <option value="meso">億楓幣</option>
    </select>
  </label>

  <!-- 台幣輸入 -->
  <div id="twd-fields">
    <label>起始星捲價格：<input type="number" id="start-price-twd" min="0.1" step="0.1">（元）</label>
    <label>目標星捲價格：<input type="number" id="target-price-twd" min="0.1" step="0.1">（元）</label>
  </div>
  <!-- 楓幣輸入 -->
  <div id="meso-fields" style="display:none;">
    <label>起始星捲價格：<input type="number" id="start-price-meso" min="0.1" step="0.1">（億楓幣）</label>
    <label>目標星捲價格：<input type="number" id="target-price-meso" min="0.1" step="0.1">（億楓幣）</label>
    <label>每 1 億楓幣可兌換楓點：<input type="number" id="points-per-100m" min="0.1" step="0.1"></label>
  </div>

  <button id="calculate-btn">計算期望值</button>
  <div id="result-area"></div>

  <script>
    const HIGHLIGHT = '#007bff';
  
    // 快取 DOM
    const startEl   = document.getElementById('start-star');
    const targetEl  = document.getElementById('target-star');
    const catchEl   = document.getElementById('catch-star');
    const curType   = document.getElementById('currency-type');
    const twdFlds   = document.getElementById('twd-fields');
    const mesoFlds  = document.getElementById('meso-fields');
    const btnCalc   = document.getElementById('calculate-btn');
    const resultDiv = document.getElementById('result-area');
  
    // localStorage helper
    const LS_GET = key => localStorage.getItem(key);
    const LS_SET = (key, val) => localStorage.setItem(key, val);
  
    // 1. 起始星下拉：16～19，並還原上次
    for (let i = 16; i <= 19; i++) {
      startEl.add(new Option(i, i));
    }
    if (LS_GET('star_start')) {
      startEl.value = LS_GET('star_start');
    }
  
    // 2. 目標星動態產生函式
    function refreshStars() {
      const s = +startEl.value;
      targetEl.length = 0;
      for (let v = s + 1; v <= 20; v++) {
        targetEl.add(new Option(v, v));
      }
      const t = LS_GET('star_target');
      if (t && targetEl.querySelector(`option[value="${t}"]`)) {
        targetEl.value = t;
      } else {
        targetEl.value = '20';
        LS_SET('star_target','20');
      }
    }
  
    // 3. 綁定事件：起始星／目標星
    startEl.addEventListener('change', () => {
      LS_SET('star_start', startEl.value);
      refreshStars();
    });
    targetEl.addEventListener('change', () => {
      LS_SET('star_target', targetEl.value);
    });
    refreshStars();
  
    // 4. 是否抓星
    if (LS_GET('star_catch')) {
      catchEl.value = LS_GET('star_catch');
    }
    catchEl.addEventListener('change', () => {
      LS_SET('star_catch', catchEl.value);
    });
  
    // 5. 價格模式切換
    if (LS_GET('star_type')) {
      curType.value = LS_GET('star_type');
    }
    curType.addEventListener('change', () => {
      LS_SET('star_type', curType.value);
      toggleFields();
    });
    function toggleFields() {
      if (curType.value === 'twd') {
        twdFlds.style.display = '';
        mesoFlds.style.display = 'none';
      } else {
        twdFlds.style.display = 'none';
        mesoFlds.style.display = '';
      }
    }
    toggleFields();
  
    // 6. 各價格欄位存取
    [
      ['start-price-twd','star_sp_twd'],
      ['target-price-twd','star_tp_twd'],
      ['start-price-meso','star_sp_meso'],
      ['target-price-meso','star_tp_meso'],
      ['points-per-100m','star_pp']
    ].forEach(([id, key]) => {
      const el = document.getElementById(id);
      if (LS_GET(key)) el.value = LS_GET(key);
      el.addEventListener('change', () => LS_SET(key, el.value));
    });
  
    // -------------------- 原本的計算邏輯 --------------------
  
    // 解線性方程式 (Gauss-Jordan)
    function solve(A, b) {
      const n = A.length;
      for (let i = 0; i < n; i++) {
        const piv = A[i][i];
        for (let j = i; j < n; j++) A[i][j] /= piv;
        b[i] /= piv;
        for (let k = 0; k < n; k++) {
          if (k === i) continue;
          const f = A[k][i];
          for (let j = i; j < n; j++) {
            A[k][j] -= f * A[i][j];
          }
          b[k] -= f * b[i];
        }
      }
      return b;
    }
  
    // 計算期望
    function calcExpect(sStar, tStar, P, resetStar) {
      const Q = 1 - P, states = [], idx = {};
      for (let s = resetStar + 1; s < tStar; s++) {
        idx[`${s},0`] = states.length; states.push({ s, f: 0 });
        idx[`${s},1`] = states.length; states.push({ s, f: 1 });
      }
      const N = states.length;
      const A = Array.from({ length: N }, () => Array(N).fill(0));
      const b50 = Array(N).fill(0), b9 = Array(N).fill(0), bS = Array(N).fill(0);
  
      states.forEach((st, i) => {
        const { s, f } = st;
        A[i][i] = 1; b50[i] = 1; b9[i] = 0;
        if (s + 1 < tStar) A[i][idx[`${s+1},0`]] -= P;
        if (f === 0) {
          const down = s - 1;
          if (down === resetStar) {
            A[i][idx[`${sStar},0`]] -= Q;
            bS[i] += Q;
          } else {
            A[i][idx[`${down},1`]] -= Q;
          }
        } else {
          b9[i] += Q;
          A[i][idx[`${s},0`]] -= Q;
        }
      });
  
      const sol50 = solve(A.map(r => r.slice()), b50.slice());
      const sol9  = solve(A.map(r => r.slice()), b9.slice());
      const solS  = solve(A.map(r => r.slice()), bS.slice());
      const key   = `${sStar},0`;
      return {
        x50: sol50[idx[key]],
        x9:  sol9[idx[key]],
        xScroll: solS[idx[key]] + 1
      };
    }
  
    // 按鈕事件：計算並顯示
    btnCalc.addEventListener('click', () => {
      const s        = +startEl.value;
      const t        = +targetEl.value;
      const useCatch = catchEl.value === 'yes';
      const isTwd    = curType.value === 'twd';
      const P0       = 0.3 * (useCatch ? 1.05 : 1);
  
      const sp = parseFloat(
        isTwd
          ? document.getElementById('start-price-twd').value
          : document.getElementById('start-price-meso').value
      );
      const tp = parseFloat(
        isTwd
          ? document.getElementById('target-price-twd').value
          : document.getElementById('target-price-meso').value
      );
      const pp = isTwd
        ? 1
        : parseFloat(document.getElementById('points-per-100m').value);
  
      if (!(t > s && sp > 0 && tp > 0 && (isTwd || pp > 0))) {
        resultDiv.innerHTML = '<p style="color:red;">請確認所有輸入皆大於 0，且目標星數 > 起始星數</p>';
        return;
      }
  
      // 每個 resetStar 計算
      const results = [];
      for (let r = 15; r < s; r++) {
        const { x50, x9, xScroll } = calcExpect(s, t, P0, r);
  
        // ★ 注意這裡：rawClick 是楓點，轉成幣值要除以 pp（若不是台幣）
        const rawClick   = x50 * 50 + x9 * 9;
        const clickCost  = isTwd ? rawClick : rawClick / pp;
        const scrollCost = xScroll * sp;
        const total      = clickCost + scrollCost;
  
        results.push({ r, x50, x9, clickCost, xScroll, scrollCost, total });
      }
  
      // 找最便宜的
      let best = results[0];
      results.forEach(d => { if (d.total < best.total) best = d; });
      const unit = isTwd ? '元' : '億楓幣';
  
      // 組表格
      let html = `<p style="font-size:.9rem;color:#666;margin:1rem 0 .5rem;">
                    ※重置星數：當降至此星數且未保底，會重上一張起始星捲
                  </p>
                  <table class="starforce-result" style="white-space:nowrap;">
                    <tr><th>重置星數</th>${results.map(d=>`<th>${d.r}星</th>`).join('')}</tr>`;
      const rows = [
        { name:'點星期望次數(50元)', key:'x50',     fmt:v=>v.toFixed(2)+' 次' },
        { name:'保底成功期望次數(9元)', key:'x9',   fmt:v=>v.toFixed(2)+' 次' },
        { name:'點星總花費期望值',       key:'clickCost', fmt:v=>v.toFixed(2)+' '+unit },
        { name:'起始星捲張數期望值',    key:'xScroll',    fmt:v=>v.toFixed(2)+' 張' },
        { name:'星捲總花費期望值',       key:'scrollCost', fmt:v=>v.toFixed(2)+' '+unit },
        { name:'總花費期望值',          key:'total',      fmt:v=>v.toFixed(2)+' '+unit },
        { name:'比起目標星捲',          key:'total',      fmt:v=>{
            const diff = v - tp;
            return diff<=0
              ? `<strong style="color:var(--sf-green)">便宜 ${Math.abs(diff).toFixed(2)} ${unit}</strong>`
              : `<strong style="color:var(--sf-red)">貴 ${diff.toFixed(2)} ${unit}</strong>`;
          }}
      ];
      rows.forEach(row => {
        html += `<tr><th>${row.name}</th>`;
        results.forEach(d => {
          html += `<td${d.r===best.r?' class="best"':''}>${row.fmt(d[row.key])}</td>`;
        });
        html += `</tr>`;
      });
      html += `</table>`;
  
      // 建議文字
      const diff = best.total - tp;
      const advice = diff<=0
        ? `比直接購買目標星捲便宜 ${Math.abs(diff).toFixed(2)} ${unit}，手氣好可以試試！`
        : `比直接購買目標星捲還貴 ${diff.toFixed(2)} ${unit}，期望值已經虧了，還要賭嗎？`;
      html += `<p id="starforce-advice" style="margin-top:.75rem;font-weight:bold;">
                 <span style="color:${HIGHLIGHT};">重置星數設為 ${best.r} 星最划算</span>
                 <span style="color:${diff<=0?'green':'red'};">${advice}</span>
               </p>`;
  
      resultDiv.innerHTML = html;
    });
  </script>
  
</section>

  <script>
  if ('Notification' in window && Notification.permission === 'default') {
  // 顯示瀏覽器原生對話框讓使用者按「允許」
  Notification.requestPermission();
}  
  /* 依選項切換圖示 ── 小 ⇄ 大 */
  function updateIcon(def, choice, img){
    switch (def.id){
      case 'wealth_potion':
      case 'exp_potion':
        img.src = (choice === '2小時') ? def.iconLarge : def.iconSmall;
        break;
      case 'firestarter':
        img.src = (choice === '30分鐘') ? def.iconLarge : def.iconSmall;
        break;
      case 'exp_double':
        img.src = (choice === '15分鐘') ? def.iconLarge : def.iconSmall;
        break;
      default:
        img.src = def.iconSmall;
    }
  }
  
  function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 3000);   // 3 秒後淡出
}

  /* --- 分頁切換 --- */
  const navBtns=document.querySelectorAll('nav button');
  const sections=document.querySelectorAll('section');
  navBtns.forEach(btn=>{
    btn.addEventListener('click',()=>{
      navBtns.forEach(b=>b.classList.remove('active'));
      sections.forEach(s=>s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  /* 抓取 CD 計算機表單元件 */
  const percentage = document.getElementById('percentage');
  const original   = document.getElementById('original');
  const reduced    = document.getElementById('reduced');
  const resultBox  = document.getElementById('result');
  const calc       = document.getElementById('calc');
  // 讀 localStorage
  percentage.value = localStorage.getItem('cd_percentage') || '5%';
  reduced.value    = localStorage.getItem('cd_reduced')    || '0';
  original.value   = localStorage.getItem('cd_original')   || '';

  // 按 Enter 也觸發計算
  [percentage, original, reduced].forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') calc.click();
    });
  });
  percentage.addEventListener('change', ()=> localStorage.setItem('cd_percentage', percentage.value));
  reduced   .addEventListener('change', ()=> localStorage.setItem('cd_reduced',    reduced.value));
  original  .addEventListener('change', ()=> localStorage.setItem('cd_original',   original.value));

  /* --- CD 帽計算機 --- */
  calc.addEventListener('click', () => {
  const pct  = parseFloat(percentage.value) / 100;
  const orig = parseFloat(original.value);
  const red  = parseInt(reduced.value, 10);
  if (isNaN(orig) || orig <= 0) {
    resultBox.textContent = '請輸入大於 0 的技能秒數。';
    return;
  }

  /* 1. 精靈卡％（下限 1 秒） */
  let afterCard = Math.max(orig * (1 - pct), 1);
  const elfReduction = orig - afterCard;           // ← ❶ 精靈卡實際減少

  let final;                                       // 最終 CD
  let equipReduction = 0;                          // ❷ 裝備實際減少

  /* 2. 若 afterCard < 5，裝備不生效 */
  if (afterCard < 5) {
    final = afterCard;
  } else {
    /* 3. 裝備公式（afterCard ≥ 5 時才跑） */
    let result;
    if (afterCard > 10) {
      if (afterCard - red > 10) {
        result = afterCard - red;
      } else {
        const used      = afterCard - 10;
        const remaining = red - used;
        result = 10 * (1 - 0.05 * remaining);
      }
    } else {
      result = afterCard * (1 - 0.05 * red);
    }

    /* 4. 全局下限 5 秒 */
    final = Math.max(result, 5);

    /* ❷ 計算裝備實際減少量（可能被下限吃掉） */
    equipReduction = afterCard - final;
  }

  /* 5. 輸出格式 */
  resultBox.innerHTML = `
  <table>
    <tr><th>原 CD</th><td>${orig.toFixed(2)}s</td></tr>
    <tr><th>精靈卡減少</th><td>${elfReduction.toFixed(2)}s</td></tr>
    <tr><th>裝備減少</th><td>${equipReduction.toFixed(2)}s</td></tr>
    <tr><th>最終 CD</th><td>${final.toFixed(3)}s</td></tr>
  </table>`;
});

  
  /* ---------- 練等計時器：資料定義 ---------- */
  const timerDefs = [
  { id:'wealth_potion', label:'財物秘藥',
    iconSmall:'assets/Small_Wealth_Acquisition_Potion.png',
    iconLarge:'assets/Wealth_Acquisition_Potion.png',
    options:[['無',null],['30分鐘',1800],['2小時',7200]] },

  { id:'exp_potion', label:'經驗秘藥',
    iconSmall:'assets/Small_EXP_Accumulation_Potion.png',
    iconLarge:'assets/EXP_Accumulation_Potion.png',
    options:[['無',null],['30分鐘',1800],['2小時',7200]] },

  { id:'firestarter', label:'燃燒之戒',
    iconSmall:'assets/Firestarter_coupon.png',
    iconLarge:'assets/Firestarter.png',
    options:[['無',null],['15分鐘',900],['30分鐘',1800]] },   

  { id:'exp_double', label:'經驗加倍',
    iconSmall:'assets/exp_double.png',
    iconLarge:'assets/15min.png',                             
    options:[['無',null],['10分鐘',600],['15分鐘',900],['20分鐘',1200],['30分鐘',1800],['1小時',3600]] },

  { id:'luck',          label:'聯盟幸運',
    iconSmall:'assets/luck.png',
    options:[['無',null],['10分鐘',600],['20分鐘',1200],['30分鐘',1800]] },

  { id:'wealth',        label:'聯盟之富',
    iconSmall:'assets/wealth.png',
    options:[['無',null],['10分鐘',600],['20分鐘',1200],['30分鐘',1800]] },

  { id:'lie_detector',  label:'被測謊了',
    iconSmall:'assets/polygraph.png',
    options:[['無',null],['10分鐘',600]] }
];


/* ---------- 動態產生 HTML ---------- */
const rowsContainer = document.getElementById('timerRows');
timerDefs.forEach(def=>{
  const row = document.createElement('div');
  row.className='timer-row';
  row.style="display:flex;align-items:center;gap:.5rem;margin:.3rem 0";

  // 圖示
  const img = document.createElement('img');
  img.src = def.iconSmall;
  img.alt = def.label;
  img.style = "width:24px;height:24px";
  img.id = `img_${def.id}`;
  row.appendChild(img);

  // 標籤文字
  const label = document.createElement('span');
  label.textContent = def.label;
  label.style="width:100px;display:inline-block";
  row.appendChild(label);

  // 時間下拉
  const sel = document.createElement('select');
  sel.id = `sel_${def.id}`;
  def.options.forEach(([txt,_s])=>{
    const opt=document.createElement('option');opt.textContent=txt;sel.appendChild(opt);
  });
  row.appendChild(sel);
  sel.addEventListener('change', () => updateIcon(def, sel.value, img));

  // 開始 / 清除
  const startBtn=document.createElement('button');
  startBtn.textContent='開始';
  const clearBtn=document.createElement('button');
  clearBtn.textContent='清除';
  row.appendChild(startBtn);
  row.appendChild(clearBtn);

  // 倒數顯示
  const disp=document.createElement('span');
  disp.id=`disp_${def.id}`;
  disp.textContent='00:00';
  disp.style="width:60px;text-align:center";
  row.appendChild(disp);

  rowsContainer.appendChild(row);

  // 綁定事件
  startBtn.addEventListener('click',()=> startTimer(def.id));
  clearBtn.addEventListener('click', ()=> clearTimer(def.id));
});

/* ---------- 計時器邏輯 ---------- */
/* 僅存各列的結束時間 (ms) */
const timers = {};  // { id: { endTime: 1690000000000 } }
let masterLoopId;

/* 判斷頁面可見性自動切換 rAF / setTimeout */
function scheduleNext(){
  if (document.hidden){
    masterLoopId = setTimeout(masterLoop, 1000);      // 背景：每秒對時一次
  } else {
    masterLoopId = requestAnimationFrame(masterLoop); // 前景：60 fps
  }
}
document.addEventListener('visibilitychange', ()=>{   // 前景↔背景切換
  if (document.hidden) {
    cancelAnimationFrame(masterLoopId);
  } else {
    clearTimeout(masterLoopId);
  }
  scheduleNext();
});

function masterLoop(){
  const now = Date.now();

  Object.entries(timers).forEach(([id, t])=>{
    const left = Math.max(0, Math.ceil((t.endTime - now)/1000)); // 剩餘整秒
    const disp = document.getElementById(`disp_${id}`);
    if (disp.textContent !== format(left)) disp.textContent = format(left);

    /* 0 秒 → 觸發結束流程 (選單保留) */
    if (left === 0){
      const def = timerDefs.find(d=>d.id===id);
      const row = disp.parentElement;

      clearTimer(id, false);         // 保留選單
      row.style.background = '#ffdddd';
      document.getElementById('ding').play().catch(()=>{});
      showToast(`${def.label} 已結束！`);
      document.querySelector('header').scrollIntoView({behavior:'smooth'});
      if (Notification.permission === 'granted') {
        new Notification(`${def.label} 已結束！`, {
          body: '點擊可返回計時頁面',
          icon: 'assets/bell.png'
        });
      }
    }
  });

  scheduleNext();   // 迴圈自己排下一次
}
scheduleNext();      // 頁面載入立即啟動

function format(sec){
  const m=String(Math.floor(sec/60)).padStart(2,'0');
  const s=String(sec%60).padStart(2,'0');
  return `${m}:${s}`;
}

function startTimer(id){
  const row = document.getElementById(`disp_${id}`).parentElement;
  const def  = timerDefs.find(d => d.id === id);
  const sel  = document.getElementById(`sel_${id}`);
  const img  = document.getElementById(`img_${id}`);
  row.classList.add('running');

  /* 解析選項秒數 */
  const sec = def.options.find(o => o[0] === sel.value)?.[1];
  if (sec == null){ clearTimer(id); return; }

  /* 換圖、清紅底 */
  updateIcon(def, sel.value, img);
  row.style.background = '';

  /* 設定絕對結束時間 */
  timers[id] = { endTime: Date.now() + sec*1000 };

  document.getElementById(`disp_${id}`).textContent = format(sec);
}


function clearTimer(id, resetSelect = true){
  delete timers[id];                       // 沒有 intervalId 了

  const sel  = document.getElementById(`sel_${id}`);
  const disp = document.getElementById(`disp_${id}`);
  const img  = document.getElementById(`img_${id}`);
  const def  = timerDefs.find(d => d.id === id);

  disp.textContent = '00:00';
  if (resetSelect) sel.value = '無';
  updateIcon(def, sel.value, img);
  disp.parentElement.style.background = '';
  checkAllRows();
  disp.parentElement.classList.remove('running');
}

/* 檢查是否所有 row 都是紅色；若否，取消整頁置頂  */
function checkAllRows(){
  const anyRed = [...document.querySelectorAll('.timer-row')]
                 .some(r => r.style.background === 'rgb(255, 221, 221)');
  if(!anyRed) document.title = '楓之谷工具箱';
}

/* 全部開始 / 全部清除 */
document.getElementById('startAll').addEventListener('click',()=>{
  timerDefs.forEach(def=> startTimer(def.id));
});
document.getElementById('clearAll').addEventListener('click',()=>{
  timerDefs.forEach(def=> clearTimer(def.id));
});
/* 重啟結束項 */
const restartDone = document.getElementById('restartDone');
restartDone.addEventListener('click', () => {
  timerDefs.forEach(def => {
    const sel = document.getElementById(`sel_${def.id}`);
    const row = document.getElementById(`disp_${def.id}`).parentElement;
    if (!timers[def.id] && sel.value !== '無' &&
        row.style.background === 'rgb(255, 221, 221)'){
      startTimer(def.id);
    }
  });
});

  position:fixed;right:1rem;bottom:1rem;z-index:9999;
