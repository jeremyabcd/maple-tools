<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>楓之谷工具箱</title>

  <style>
    :root{
      --main-color:#ff7b00;
      --bg-grad:linear-gradient(135deg,#ffe6c9 0%,#fff8ee 40%,#e9f6ff 100%);
    }
    body{
      margin:0;font-family: "Segoe UI",sans-serif;
      background:var(--bg-grad);
      min-height:100vh;
      display:flex;flex-direction:column;
    }
    header{background:#fff8ee;padding:1rem 2rem;box-shadow:0 2px 4px rgba(0,0,0,.1)}
    h1{margin:0;font-size:1.6rem;color:var(--main-color)}
    nav{margin-top:1rem;border-bottom:2px solid #ddd;display:flex;gap:1rem}
    nav button{
      background:none;border:none;padding:.5rem 1rem;font-size:1rem;
      cursor:pointer;border-bottom:3px solid transparent;
      border-radius:8px 8px 0 0;
      transition:background .15s, box-shadow .15s;             
    }
    nav button:hover{
      background:rgba(0,0,0,.05);
      box-shadow:0 2px 4px rgba(0,0,0,.15);
    }
    nav button.active{
      color:var(--main-color);
      border-color:var(--main-color);
      font-weight:bold;
      background:#ffffff;                    
    }
    section{display:none;padding:2rem}
    section.active{display:block}
    .timer-row.running {background: #e0f7fa;    /* 淺青底 */}
    label{display:block;margin:.8rem 0}
    input,select,button{
      padding:.4rem .6rem;font-size:1rem;
      border-radius:8px;                     
      border:1px solid #ccc;
      box-shadow:inset 0 1px 2px rgba(0,0,0,.07);
    }
    button{cursor:pointer;background:#fff;}
    button:hover{background:#f8f8f8;}
    input:focus,select:focus{
      outline:none;                                   /* 去掉預設藍框 */
      border-color:var(--main-color);                 /* 換成主題色 */
      box-shadow:0 0 0 3px rgba(255,123,0,.25);       /* 外圈光暈 */
    }
    #result{margin-top:1rem;font-weight:bold}
    /* CD 計算表格樣式 */
    #result table {
      border-collapse: collapse;
      margin-top: .5rem;
    }
    #result th,
    #result td {
      padding: .3rem .6rem;
      border: 1px solid #ccc;
    }
    #result th {
      text-align: right;
      color: #555;
    }
    footer{margin-top:auto;text-align:center;padding:1rem 0;font-size:.85rem;color:#666}
  </style>
</head>
<body>
  <header>
    <h1>楓之谷工具箱</h1>
    <nav>
      <button data-tab="cd"   class="active">CD 帽計算機</button>
      <button data-tab="timer">練等計時器</button>
      <button data-tab="star">偷星計算機</button>
    </nav>
  </header>

  <!-- CD 帽計算機 -->
  <section id="cd" class="active">
    <h2>CD 帽計算機</h2>

    <label>
      精靈角色卡減少%數：
      <select id="percentage">
        <option>0%</option>
        <option selected>5%</option>
        <option>6%</option>
      </select>
    </label>

    <label>
      技能秒數：
      <input type="number" id="original" placeholder="例如 120">
    </label>

    <label>
      裝備CD減少秒數(含羈絆翅膀)：
      <select id="reduced">
        <option value="0">0</option><option value="1">1</option><option value="2">2</option>
        <option value="3">3</option><option value="4">4</option><option value="5">5</option>
        <option value="6">6</option><option value="7">7</option><option value="8">8</option>
        <option value="9">9</option><option value="10">10</option>
      </select>
      秒
    </label>

    <button id="calc">計算</button>
    <div id="result"></div>
  </section>

  <!-- 練等計時器 -->
  <section id="timer">
    <h2>練等計時器</h2>
    <div style="margin-bottom:1rem">
      <button id="startAll">全部開始</button>
      <button id="clearAll">全部清除</button>
      <button id="restartDone">重啟結束項</button>
    </div>
    <div id="timerRows"></div>
  </section>



  <section id="star"><h2>偷星計算機</h2><p>施工中…</p></section>



  <footer>© 2025 Maple Tools</footer>

  <script>
  if ('Notification' in window && Notification.permission === 'default') {
  // 顯示瀏覽器原生對話框讓使用者按「允許」
  Notification.requestPermission();
}  
  /* 依選項切換圖示 ── 小 ⇄ 大 */
  function updateIcon(def, choice, img){
    switch (def.id){
      case 'wealth_potion':
      case 'exp_potion':
        img.src = (choice === '2小時') ? def.iconLarge : def.iconSmall;
        break;
      case 'firestarter':
        img.src = (choice === '30分鐘') ? def.iconLarge : def.iconSmall;
        break;
      case 'exp_double':
        img.src = (choice === '15分鐘') ? def.iconLarge : def.iconSmall;
        break;
      default:
        img.src = def.iconSmall;
    }
  }
  
  function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 3000);   // 3 秒後淡出
}

  /* --- 分頁切換 --- */
  const navBtns=document.querySelectorAll('nav button');
  const sections=document.querySelectorAll('section');
  navBtns.forEach(btn=>{
    btn.addEventListener('click',()=>{
      navBtns.forEach(b=>b.classList.remove('active'));
      sections.forEach(s=>s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  /* 抓取 CD 計算機表單元件 */
  const percentage = document.getElementById('percentage');
  const original   = document.getElementById('original');
  const reduced    = document.getElementById('reduced');
  const resultBox  = document.getElementById('result');
  const calc       = document.getElementById('calc');
  // 讀 localStorage
  percentage.value = localStorage.getItem('cd_percentage') || '5%';
  reduced.value    = localStorage.getItem('cd_reduced')    || '0';
  original.value   = localStorage.getItem('cd_original')   || '';

  // 按 Enter 也觸發計算
  [percentage, original, reduced].forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') calc.click();
    });
  });
  percentage.addEventListener('change', ()=> localStorage.setItem('cd_percentage', percentage.value));
  reduced   .addEventListener('change', ()=> localStorage.setItem('cd_reduced',    reduced.value));
  original  .addEventListener('change', ()=> localStorage.setItem('cd_original',   original.value));

  /* --- CD 帽計算機 --- */
  calc.addEventListener('click', () => {
  const pct  = parseFloat(percentage.value) / 100;
  const orig = parseFloat(original.value);
  const red  = parseInt(reduced.value, 10);
  if (isNaN(orig) || orig <= 0) {
    resultBox.textContent = '請輸入大於 0 的技能秒數。';
    return;
  }

  /* 1. 精靈卡％（下限 1 秒） */
  let afterCard = Math.max(orig * (1 - pct), 1);
  const elfReduction = orig - afterCard;           // ← ❶ 精靈卡實際減少

  let final;                                       // 最終 CD
  let equipReduction = 0;                          // ❷ 裝備實際減少

  /* 2. 若 afterCard < 5，裝備不生效 */
  if (afterCard < 5) {
    final = afterCard;
  } else {
    /* 3. 裝備公式（afterCard ≥ 5 時才跑） */
    let result;
    if (afterCard > 10) {
      if (afterCard - red > 10) {
        result = afterCard - red;
      } else {
        const used      = afterCard - 10;
        const remaining = red - used;
        result = 10 * (1 - 0.05 * remaining);
      }
    } else {
      result = afterCard * (1 - 0.05 * red);
    }

    /* 4. 全局下限 5 秒 */
    final = Math.max(result, 5);

    /* ❷ 計算裝備實際減少量（可能被下限吃掉） */
    equipReduction = afterCard - final;
  }

  /* 5. 輸出格式 */
  resultBox.innerHTML = `
  <table>
    <tr><th>原 CD</th><td>${orig.toFixed(2)}s</td></tr>
    <tr><th>精靈卡減少</th><td>${elfReduction.toFixed(2)}s</td></tr>
    <tr><th>裝備減少</th><td>${equipReduction.toFixed(2)}s</td></tr>
    <tr><th>最終 CD</th><td>${final.toFixed(3)}s</td></tr>
  </table>`;
});


  /* ---------- 練等計時器：資料定義 ---------- */
  const timerDefs = [
  { id:'wealth_potion', label:'財物秘藥',
    iconSmall:'assets/Small_Wealth_Acquisition_Potion.png',
    iconLarge:'assets/Wealth_Acquisition_Potion.png',
    options:[['無',null],['30分鐘',1800],['2小時',7200]] },

  { id:'exp_potion', label:'經驗秘藥',
    iconSmall:'assets/Small_EXP_Accumulation_Potion.png',
    iconLarge:'assets/EXP_Accumulation_Potion.png',
    options:[['無',null],['30分鐘',1800],['2小時',7200]] },

  { id:'firestarter', label:'燃燒之戒',
    iconSmall:'assets/Firestarter_coupon.png',
    iconLarge:'assets/Firestarter.png',
    options:[['無',null],['15分鐘',900],['30分鐘',1800]] },   

  { id:'exp_double', label:'經驗加倍',
    iconSmall:'assets/exp_double.png',
    iconLarge:'assets/15min.png',                             
    options:[['無',null],['10分鐘',600],['15分鐘',900],['20分鐘',1200],['30分鐘',1800],['1小時',3600]] },

  { id:'luck',          label:'聯盟幸運',
    iconSmall:'assets/luck.png',
    options:[['無',null],['10分鐘',600],['20分鐘',1200],['30分鐘',1800]] },

  { id:'wealth',        label:'聯盟之富',
    iconSmall:'assets/wealth.png',
    options:[['無',null],['10分鐘',600],['20分鐘',1200],['30分鐘',1800]] },

  { id:'lie_detector',  label:'被測謊了',
    iconSmall:'assets/polygraph.png',
    options:[['無',null],['10分鐘',600]] }
];


/* ---------- 動態產生 HTML ---------- */
const rowsContainer = document.getElementById('timerRows');
timerDefs.forEach(def=>{
  const row = document.createElement('div');
  row.className='timer-row';
  row.style="display:flex;align-items:center;gap:.5rem;margin:.3rem 0";

  // 圖示
  const img = document.createElement('img');
  img.src = def.iconSmall;
  img.alt = def.label;
  img.style = "width:24px;height:24px";
  img.id = `img_${def.id}`;
  row.appendChild(img);

  // 標籤文字
  const label = document.createElement('span');
  label.textContent = def.label;
  label.style="width:100px;display:inline-block";
  row.appendChild(label);

  // 時間下拉
  const sel = document.createElement('select');
  sel.id = `sel_${def.id}`;
  def.options.forEach(([txt,_s])=>{
    const opt=document.createElement('option');opt.textContent=txt;sel.appendChild(opt);
  });
  row.appendChild(sel);
  sel.addEventListener('change', () => updateIcon(def, sel.value, img));

  // 開始 / 清除
  const startBtn=document.createElement('button');
  startBtn.textContent='開始';
  const clearBtn=document.createElement('button');
  clearBtn.textContent='清除';
  row.appendChild(startBtn);
  row.appendChild(clearBtn);

  // 倒數顯示
  const disp=document.createElement('span');
  disp.id=`disp_${def.id}`;
  disp.textContent='00:00';
  disp.style="width:60px;text-align:center";
  row.appendChild(disp);

  rowsContainer.appendChild(row);

  // 綁定事件
  startBtn.addEventListener('click',()=> startTimer(def.id));
  clearBtn.addEventListener('click', ()=> clearTimer(def.id));
});

/* ---------- 計時器邏輯 ---------- */
/* 僅存各列的結束時間 (ms) */
const timers = {};  // { id: { endTime: 1690000000000 } }
let masterLoopId;

/* 判斷頁面可見性自動切換 rAF / setTimeout */
function scheduleNext(){
  if (document.hidden){
    masterLoopId = setTimeout(masterLoop, 1000);      // 背景：每秒對時一次
  } else {
    masterLoopId = requestAnimationFrame(masterLoop); // 前景：60 fps
  }
}
document.addEventListener('visibilitychange', ()=>{   // 前景↔背景切換
  if (document.hidden) {
    cancelAnimationFrame(masterLoopId);
  } else {
    clearTimeout(masterLoopId);
  }
  scheduleNext();
});

function masterLoop(){
  const now = Date.now();

  Object.entries(timers).forEach(([id, t])=>{
    const left = Math.max(0, Math.ceil((t.endTime - now)/1000)); // 剩餘整秒
    const disp = document.getElementById(`disp_${id}`);
    if (disp.textContent !== format(left)) disp.textContent = format(left);

    /* 0 秒 → 觸發結束流程 (選單保留) */
    if (left === 0){
      const def = timerDefs.find(d=>d.id===id);
      const row = disp.parentElement;

      clearTimer(id, false);         // 保留選單
      row.style.background = '#ffdddd';
      document.getElementById('ding').play().catch(()=>{});
      showToast(`${def.label} 已結束！`);
      document.querySelector('header').scrollIntoView({behavior:'smooth'});
      if (Notification.permission === 'granted') {
        new Notification(`${def.label} 已結束！`, {
          body: '點擊可返回計時頁面',
          icon: 'assets/bell.png'
        });
      }
    }
  });

  scheduleNext();   // 迴圈自己排下一次
}
scheduleNext();      // 頁面載入立即啟動

function format(sec){
  const m=String(Math.floor(sec/60)).padStart(2,'0');
  const s=String(sec%60).padStart(2,'0');
  return `${m}:${s}`;
}

function startTimer(id){
  const row = document.getElementById(`disp_${id}`).parentElement;
  const def  = timerDefs.find(d => d.id === id);
  const sel  = document.getElementById(`sel_${id}`);
  const img  = document.getElementById(`img_${id}`);
  row.classList.add('running');

  /* 解析選項秒數 */
  const sec = def.options.find(o => o[0] === sel.value)?.[1];
  if (sec == null){ clearTimer(id); return; }

  /* 換圖、清紅底 */
  updateIcon(def, sel.value, img);
  row.style.background = '';

  /* 設定絕對結束時間 */
  timers[id] = { endTime: Date.now() + sec*1000 };

  document.getElementById(`disp_${id}`).textContent = format(sec);
}


function clearTimer(id, resetSelect = true){
  delete timers[id];                       // 沒有 intervalId 了

  const sel  = document.getElementById(`sel_${id}`);
  const disp = document.getElementById(`disp_${id}`);
  const img  = document.getElementById(`img_${id}`);
  const def  = timerDefs.find(d => d.id === id);

  disp.textContent = '00:00';
  if (resetSelect) sel.value = '無';
  updateIcon(def, sel.value, img);
  disp.parentElement.style.background = '';
  checkAllRows();
  disp.parentElement.classList.remove('running');
}

/* 檢查是否所有 row 都是紅色；若否，取消整頁置頂  */
function checkAllRows(){
  const anyRed = [...document.querySelectorAll('.timer-row')]
                 .some(r => r.style.background === 'rgb(255, 221, 221)');
  if(!anyRed) document.title = '楓之谷工具箱';
}

/* 全部開始 / 全部清除 */
document.getElementById('startAll').addEventListener('click',()=>{
  timerDefs.forEach(def=> startTimer(def.id));
});
document.getElementById('clearAll').addEventListener('click',()=>{
  timerDefs.forEach(def=> clearTimer(def.id));
});
/* 重啟結束項 */
const restartDone = document.getElementById('restartDone');
restartDone.addEventListener('click', () => {
  timerDefs.forEach(def => {
    const sel = document.getElementById(`sel_${def.id}`);
    const row = document.getElementById(`disp_${def.id}`).parentElement;
    if (!timers[def.id] && sel.value !== '無' &&
        row.style.background === 'rgb(255, 221, 221)'){
      startTimer(def.id);
    }
  });
});

  </script>
<audio id="ding" src="assets/ding.mp3" preload="auto"></audio>
<div id="toast" style="
  position:fixed;right:1rem;bottom:1rem;z-index:9999;
  background:#333;color:#fff;padding:.6rem 1rem;border-radius:8px;
  opacity:0;transition:opacity .3s"></div>
</body>
</html>
